<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello Nakornpathom — Old Town</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#092527;color:#f6edce;font-family:system-ui,sans-serif}#game{width:100%;height:100vh;height:100dvh;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none}#loader,#rotate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#092527;padding:32px;text-align:center;z-index:3}h1{font-size:clamp(25px,5vw,50px);letter-spacing:.06em;margin:8px}p{color:#c3d3cb;line-height:1.6}progress{width:min(400px,75vw);height:10px;accent-color:#eab662}button{background:#eab662;color:#122e2d;border:0;border-radius:6px;padding:13px 22px;font-weight:700;cursor:pointer}#fullscreen{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:2;font-size:11px;padding:6px 10px;opacity:.8}#rotate{display:none;z-index:5}@media(orientation:portrait){#rotate{display:flex}}#error{color:#ffc9b8;white-space:pre-wrap;max-width:650px}
</style>
</head>
<body>
<main id="game">
<canvas id="unity-canvas" tabindex="-1"></canvas>
<section id="loader"><p>EXPLORE / THE OLD TOWN</p><h1>HELLO NAKORNPATHOM</h1><p>หวนคืนวันวานที่แสนคิดถึง</p><progress id="progress" max="1" value="0"></progress><p id="status">กำลังเตรียมสถานี…</p><p id="error"></p><button id="retry" hidden onclick="location.reload()">ลองอีกครั้ง</button></section>
<button id="fullscreen">เต็มจอ ↗</button>
<section id="rotate"><h1>หมุนเครื่องเป็นแนวนอน</h1><p>เพื่อเริ่มออกเดินทางในนครปฐม</p></section>
</main>
<script>
const canvas=document.querySelector('#unity-canvas');
const config={dataUrl:'Build/web.data',frameworkUrl:'Build/web.framework.js',codeUrl:'Build/web.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'HNP',productName:'Hello Nakornpathom',productVersion:'0.2',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)};
function fail(error){document.querySelector('#status').textContent='โหลดเกมไม่สำเร็จ';document.querySelector('#error').textContent=String(error);document.querySelector('#retry').hidden=false;}
const loader=document.createElement('script');loader.src='Build/web.loader.js';loader.onerror=()=>fail('ไม่สามารถโหลดไฟล์เกมได้ กรุณาตรวจสอบการเชื่อมต่อ');
loader.onload=()=>createUnityInstance(canvas,config,p=>{document.querySelector('#progress').value=p;document.querySelector('#status').textContent='กำลังโหลด '+Math.round(p*100)+'%';}).then(instance=>{window.hnpGame=instance;document.querySelector('#loader').style.display='none';canvas.focus();}).catch(fail);document.body.appendChild(loader);
document.querySelector('#fullscreen').onclick=async()=>{try{if(!document.fullscreenElement && document.querySelector('#game').requestFullscreen)await document.querySelector('#game').requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape');}catch(e){/* Full viewport and rotate overlay remain available. */}canvas.focus();};
</script>
</body></html>
